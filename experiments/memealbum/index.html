<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<title>MemeÁlbum — protótipo</title>
<style>
  /* MemeÁlbum — PROTÓTIPO isolado (client-side, chumbado). localStorage,
     pagamento simulado. Nada depende do Manaã. Remover = apagar a pasta. */
  :root{
    --bg:#0c0c11;--surface:#16161d;--surface-2:#1e1e27;
    --border:rgba(255,255,255,.08);--text:#f4f4f7;--text-2:#9b9ba8;--text-3:#6c6c79;
    --accent:#b06bff;--accent-2:#ff5fa2;--wa:#25d366;--ok:#34d399;
    --grad:linear-gradient(135deg,#b06bff,#ff5fa2 60%,#ffb65c);
    --rad:16px;--rsm:11px;--sh:0 10px 28px -16px rgba(0,0,0,.7);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text)}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
    min-height:100dvh;max-width:520px;margin:0 auto;padding:0 0 46px}
  button{font-family:inherit;cursor:pointer;border:0}
  input,select{font-family:inherit}
  .proto{background:#221d2b;color:#cbbfe0;font-size:10.5px;text-align:center;padding:5px 12px}
  .top{display:flex;align-items:center;gap:10px;padding:14px 18px 6px}
  .brand{display:inline-flex;align-items:center;gap:7px;font-weight:800;font-size:18px;
    text-decoration:none;color:inherit}
  .brand .mk{width:25px;height:25px;border-radius:7px;background:var(--grad);
    display:flex;align-items:center;justify-content:center}
  .brand .mk svg{width:14px;height:14px;color:#181020}
  .sp{flex:1}
  .pill{background:var(--surface-2);border:1px solid var(--border);color:var(--text-2);
    font-size:12px;font-weight:700;padding:6px 11px;border-radius:999px}
  .pill.ok{color:#b6f0d4;border-color:rgba(52,211,153,.35)}
  .wrap{padding:8px 18px}
  h2.sec{font-size:12.5px;font-weight:700;color:var(--text-2);text-transform:uppercase;
    letter-spacing:.6px;margin:20px 0 11px}
  .search{display:flex;gap:9px;margin-top:4px}
  .search input{flex:1;min-height:48px;background:var(--surface-2);border:1px solid var(--border);
    color:var(--text);border-radius:var(--rsm);padding:12px 14px;font-size:16px;outline:none}
  .search input:focus{border-color:var(--accent)}
  .search button{min-height:48px;padding:0 16px;border-radius:var(--rsm);
    background:var(--surface-2);border:1px solid var(--border);color:var(--text);font-weight:700}
  .cta{display:flex;align-items:center;gap:11px;width:100%;margin-top:13px;background:var(--grad);
    color:#181020;border-radius:15px;padding:15px 18px;font-weight:800;font-size:16px}
  .cta:active{transform:scale(.985)}
  .cta .px{margin-left:auto;background:rgba(24,16,32,.16);padding:4px 10px;border-radius:999px;font-size:13px}
  .cta svg{width:19px;height:19px}
  .tabs{display:flex;gap:8px;margin-bottom:6px}
  .tabs button{flex:1;min-height:38px;background:var(--surface-2);border:1px solid var(--border);
    color:var(--text-2);font-weight:700;font-size:13px;border-radius:9px}
  .tabs button.on{background:var(--grad);color:#181020;border-color:transparent}
  .row{display:flex;align-items:center;gap:13px;background:var(--surface);border:1px solid var(--border);
    border-radius:14px;padding:10px;margin-bottom:10px}
  .row:active{border-color:rgba(176,107,255,.45)}
  .rn{width:20px;text-align:center;font-weight:800;color:var(--text-3);flex:none}
  .mc{width:50px;height:66px;border-radius:8px;flex:none;overflow:hidden;background:var(--surface-2);position:relative}
  .mc img{width:100%;height:100%;object-fit:cover}
  .mc .ph{position:absolute;inset:0;background:var(--grad);opacity:.85}
  .row .i{flex:1;min-width:0}
  .row .i .nm{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .i .by{color:var(--text-3);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .i .ss{color:#ffc24d;font-size:12.5px;margin-top:4px;font-weight:700}
  .row .i .ss span{color:var(--text-3);font-weight:500}
  .note{color:var(--text-3);font-size:14px;text-align:center;padding:24px 10px}
  .back{display:inline-flex;align-items:center;gap:6px;color:var(--text-2);font-size:14px;
    font-weight:600;background:none;padding:13px 18px 2px}
  .back svg{width:16px;height:16px}

  .snav{display:flex;align-items:center;justify-content:space-between;margin:4px 0 11px}
  .snav .l{text-align:center;font-weight:800;font-size:15px}
  .snav .l small{display:block;font-weight:600;font-size:11.5px;color:var(--text-3);margin-top:1px}
  .nb{width:42px;height:42px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border);
    color:var(--text);display:flex;align-items:center;justify-content:center;flex:none}
  .nb:disabled{opacity:.28}.nb svg{width:17px;height:17px}

  .sheet{width:100%;border-radius:20px;overflow:hidden;border:1px solid var(--border);
    box-shadow:var(--sh);position:relative}
  .sheet.v{aspect-ratio:3/4}.sheet.h{aspect-ratio:4/3}

  .cover>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .cover .gph{position:absolute;inset:0;background:var(--grad);opacity:.9}
  .cover .sc{position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(10,10,14,.45) 0%,transparent 26%,transparent 52%,rgba(10,10,14,.9) 100%)}
  .cover .seal{position:absolute;top:14px;left:14px;display:inline-flex;align-items:center;gap:6px;
    background:var(--grad);color:#181020;font-weight:800;font-size:12px;padding:6px 12px;border-radius:999px}
  .cover .seal svg{width:13px;height:13px}
  .cover .ed{position:absolute;top:14px;right:14px;background:rgba(0,0,0,.5);color:#fff;
    font-size:11px;font-weight:700;padding:6px 10px;border-radius:999px;display:flex;align-items:center;gap:5px}
  .cover .ed svg{width:12px;height:12px}
  .cover .mt{position:absolute;left:18px;right:18px;bottom:18px}
  .cover .mt .nm{font-size:28px;font-weight:800;line-height:1.07;letter-spacing:-.5px;
    text-shadow:0 2px 12px rgba(0,0,0,.6)}
  .cover .mt .sb{color:#e8e8ee;font-size:14px;margin-top:5px;text-shadow:0 1px 6px rgba(0,0,0,.6)}
  .cover .mt .ch{display:flex;gap:7px;margin-top:12px}
  .cover .mt .ch span{background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(3px);
    backdrop-filter:blur(3px);font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px}

  .pg .deco{position:absolute;inset:0;opacity:.45;
    background:radial-gradient(560px 280px at 110% -10%,rgba(255,255,255,.16),transparent 55%)}
  .pg.bgimg .deco{display:none}
  .pg .bgsc{position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(0,0,0,.5),rgba(0,0,0,.18) 30%,rgba(0,0,0,.18) 70%,rgba(0,0,0,.55))}
  .pg .ti{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;
    justify-content:space-between;padding:12px 14px;z-index:2;gap:8px}
  .pg .ti b{font-size:14px;font-weight:800;text-shadow:0 1px 6px rgba(0,0,0,.6);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pg .ti .cn{background:var(--grad);color:#181020;font-weight:800;font-size:11px;
    padding:4px 9px;border-radius:999px;flex:none}
  .grid{position:absolute;left:0;right:0;top:42px;bottom:0;display:grid;gap:9px;
    padding:6px 12px 12px;z-index:1}
  .fig{position:relative;border-radius:10px;overflow:hidden;min-width:0;min-height:0;
    background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.12);
    display:flex;align-items:center;justify-content:center}
  .fig.has{border-color:transparent;background:#000;box-shadow:0 0 0 1px rgba(255,255,255,.12)}
  .fig img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .fig .no{color:rgba(255,255,255,.34);font-weight:800;font-size:15px;display:flex;
    flex-direction:column;align-items:center;gap:3px}
  .fig .no .pl{font-size:10px;font-weight:700;color:rgba(176,107,255,.85)}
  .fig.tap{cursor:pointer}.fig.tap:active{transform:scale(.96)}
  .fig.tap:not(.has){border-style:dashed;border-color:rgba(176,107,255,.4)}
  .fig .pen{position:absolute;top:5px;right:5px;width:22px;height:22px;border-radius:50%;
    background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center}
  .fig .pen svg{width:11px;height:11px;color:#fff}
  .fig.zoom{cursor:zoom-in}

  .zoomwrap{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:60;display:flex;
    flex-direction:column;align-items:center;justify-content:center;padding:20px}
  .zoomwrap img{max-width:94vw;max-height:78vh;border-radius:14px;object-fit:contain;
    box-shadow:0 20px 50px -10px rgba(0,0,0,.8)}
  .zoomwrap .x{margin-top:18px;background:#fff;color:#111;font-weight:800;font-size:15px;
    padding:12px 26px;border-radius:999px}

  .rate{background:var(--surface);border:1px solid var(--border);border-radius:14px;
    padding:16px;margin-top:16px;text-align:center}
  .rate .av{font-size:28px;font-weight:800}.rate .av small{font-size:13px;color:var(--text-3);font-weight:600}
  .rate .lb{color:var(--text-2);font-size:13px;margin:3px 0 11px}
  .rate .st{display:flex;justify-content:center;gap:6px}
  .rate .st button{background:none;font-size:31px;line-height:1;color:#3a3a44;padding:2px}
  .rate .st button.lit{color:#ffc24d}
  .rate .dn{color:var(--ok);font-size:13px;font-weight:700;margin-top:9px;min-height:17px}

  .scta{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;
    background:var(--wa);color:#06301a;font-size:16px;font-weight:800;border-radius:14px;margin-top:15px}
  .scta:active{transform:scale(.98)}.scta svg{width:21px;height:21px}
  .subc{width:100%;min-height:48px;background:var(--surface-2);border:1px solid var(--border);
    color:var(--text);font-weight:700;font-size:15px;border-radius:13px;margin-top:9px}
  .sh{font-size:11.5px;color:var(--text-3);text-align:center;margin-top:9px}

  .pay{background:var(--surface);border:1px solid var(--border);border-radius:18px;
    padding:24px 18px;margin-top:14px;text-align:center}
  .pay .tg{display:inline-block;background:var(--grad);color:#181020;font-weight:800;
    font-size:11.5px;padding:5px 12px;border-radius:999px;margin-bottom:13px}
  .pay h3{font-size:21px;font-weight:800;margin-bottom:5px}
  .pay .pr{font-size:38px;font-weight:800;margin:14px 0 4px}
  .pay .pr small{font-size:15px;color:var(--text-2);font-weight:600}
  .pay p{color:var(--text-2);font-size:14px;margin-bottom:18px}
  .pay ul{list-style:none;text-align:left;margin:0 auto 20px;max-width:260px;font-size:14px;color:var(--text-2)}
  .pay li{display:flex;gap:9px;padding:5px 0}.pay li b{color:var(--text)}
  .pay li svg{width:17px;height:17px;color:var(--ok);flex:none;margin-top:2px}
  .pgo{width:100%;min-height:52px;background:var(--grad);color:#181020;font-weight:800;
    font-size:16px;border-radius:13px}.pgo:active{transform:scale(.98)}
  .palt{width:100%;min-height:44px;background:none;border:1px solid var(--border);
    color:var(--text-2);font-weight:700;font-size:13px;border-radius:11px;margin-top:9px}
  .pn{font-size:11.5px;color:var(--text-3);margin-top:11px}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:15px;margin-top:13px}
  .fl{margin-bottom:12px}.fl:last-child{margin-bottom:0}
  .fl label{display:block;font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:6px}
  .fl input,.fl select{width:100%;min-height:46px;background:var(--surface-2);border:1px solid var(--border);
    color:var(--text);border-radius:10px;padding:11px 13px;font-size:16px;outline:none}
  .fl input:focus,.fl select:focus{border-color:var(--accent)}
  .fl select{appearance:none}
  .swatches{display:flex;gap:9px;flex-wrap:wrap}
  .swatches .sw{width:36px;height:36px;border-radius:50%;border:2px solid transparent;cursor:pointer}
  .swatches .sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--accent)}
  .seg{display:flex;gap:8px}
  .seg button{flex:1;min-height:44px;background:var(--surface-2);border:1px solid var(--border);
    color:var(--text-2);font-weight:700;font-size:14px;border-radius:10px}
  .seg button.on{background:var(--grad);color:#181020;border-color:transparent}
  .bgrow{display:flex;gap:9px;margin-top:10px}
  .bgrow button{flex:1;min-height:42px;border-radius:10px;font-weight:700;font-size:13px;
    background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    display:flex;align-items:center;justify-content:center;gap:6px}
  .bgrow button svg{width:14px;height:14px}
  .bgrow button.rm{color:#ffb0b0;border-color:rgba(255,90,90,.3)}
  .acts{display:flex;gap:9px;margin-top:14px}
  .acts button{flex:1;min-height:50px;border-radius:12px;font-weight:800;font-size:15px}
  .ap{background:var(--surface-2);border:1px solid var(--border);color:var(--text)}
  .pb{background:var(--grad);color:#181020}
  .tip{font-size:12px;color:var(--text-3);text-align:center;margin-top:11px}
  .busy{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;
    justify-content:center;z-index:70;color:#fff;font-weight:700}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
  <div class="proto">protótipo · dados só neste navegador · pagamento simulado</div>
  <div class="top">
    <a class="brand" href="#/"><span class="mk"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.6 6.5L21 9.3l-5 4.4 1.6 6.8L12 16.9 6.4 20.5 8 13.7 3 9.3l6.4-.8z"/></svg></span>MemeÁlbum</a>
    <span class="sp"></span><span class="pill" id="mp">Sem passe</span>
  </div>
  <main id="app" class="wrap"></main>
<script>
"use strict";
(function(){
  var $=function(s,r){return (r||document).querySelector(s);};
  var el=function(h){var d=document.createElement("div");d.innerHTML=h.trim();return d.firstChild;};
  var esc=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});};
  var slug=function(s){return String(s||"").toLowerCase().normalize("NFD")
    .replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"")||"album";};
  var PRICE="19,90";

  /* compressão (canvas só p/ encolher) */
  function compress(file,cb){
    var u=URL.createObjectURL(file),i=new Image();
    i.onload=function(){var m=900,w=i.width,h=i.height;
      if(w>=h&&w>m){h=Math.round(h*m/w);w=m;}else if(h>w&&h>m){w=Math.round(w*m/h);h=m;}
      var c=document.createElement("canvas");c.width=w;c.height=h;
      try{c.getContext("2d").drawImage(i,0,0,w,h);cb(c.toDataURL("image/jpeg",0.82));}catch(e){cb(null);}
      URL.revokeObjectURL(u);};
    i.onerror=function(){URL.revokeObjectURL(u);cb(null);};i.src=u;}
  function busy(o){var b=$("#bz");if(o&&!b)document.body.appendChild(el('<div class="busy" id="bz">Processando imagem…</div>'));else if(!o&&b)b.remove();}
  function pick(cb){var n=document.createElement("input");n.type="file";n.accept="image/*";
    n.style.cssText="position:fixed;left:-9999px;opacity:0";document.body.appendChild(n);
    n.addEventListener("change",function(){var f=n.files&&n.files[0];
      if(f){busy(true);compress(f,function(d){busy(false);if(d)cb(d);else alert("Não consegui processar essa imagem.");});}
      if(n.parentNode)n.parentNode.removeChild(n);});n.click();}

  var THEMES=[
    "linear-gradient(160deg,#2a1a44,#1c2a4c 55%,#11202f)",
    "linear-gradient(160deg,#3d1830,#4a1c34 55%,#2c1022)",
    "linear-gradient(160deg,#163a2d,#1a4438 55%,#0f2e22)",
    "linear-gradient(160deg,#5b4710,#e0bd55 47%,#7a5c12)",
    "linear-gradient(160deg,#10324a,#15618a 50%,#0b2c40)",
    "linear-gradient(160deg,#4a1414,#8a2222 50%,#3a1010)",
    "linear-gradient(160deg,#0f3a3a,#168a86 50%,#0b2e2e)",
    "linear-gradient(160deg,#222,#3a3a44 55%,#1a1a20)"];

  function colsFor(q,orient){
    var base={5:3,6:3,7:3,8:4,9:3,10:4,11:4,12:4};
    var c=base[q]||3; if(orient==="h")c=Math.min(q,c+2); return c;
  }

  var SEED=[
    {slug:"copa-da-resenha",name:"Copa da Resenha",author:"Léo",city:"Londrina / PR",team:"Tubarões FC",rating:4.8,votes:312,when:"d",theme:0,grid:11,orient:"v",pages:[[]],bgs:[null],pageNames:["Titulares"]},
    {slug:"memes-do-trampo",name:"Memes do Trampo",author:"Bia",city:"Maringá / PR",team:"Time da firma",rating:4.6,votes:198,when:"d",theme:1,grid:9,orient:"v",pages:[[],[]],bgs:[null,null],pageNames:["A galera","Os chefes"]},
    {slug:"galera-da-facul",name:"Galera da Facul",author:"Rafa",city:"Curitiba / PR",team:"ADS 2026",rating:4.5,votes:140,when:"w",theme:4,grid:8,orient:"v",pages:[[]],bgs:[null],pageNames:[""]},
    {slug:"pelada-de-domingo",name:"Pelada de Domingo",author:"Tonho",city:"São Paulo / SP",team:"FC Várzea",rating:4.3,votes:96,when:"w",theme:2,grid:12,orient:"v",pages:[[]],bgs:[null],pageNames:["Elenco"]},
    {slug:"familia-funaro",name:"Família Funaro",author:"Luigi",city:"Londrina / PR",team:"Os Funaro",rating:4.9,votes:71,when:"m",theme:3,grid:6,orient:"v",pages:[[]],bgs:[null],pageNames:[""]}];
  function DB(){var r;try{r=JSON.parse(localStorage.getItem("memealbum_db"));}catch(e){}
    if(!r||!r.albums)r={albums:{},rated:{},member:false};return r;}
  function save(d){try{localStorage.setItem("memealbum_db",JSON.stringify(d));return true;}
    catch(e){alert("Memória do navegador cheia (protótipo). Apague um álbum de teste.");return false;}}
  function member(){return !!DB().member;}
  function setMember(v){var d=DB();d.member=v;save(d);mp();}
  function mp(){var p=$("#mp");if(member()){p.textContent="Passe ativo ✓";p.className="pill ok";}
    else{p.textContent="Sem passe";p.className="pill";}}
  function all(){var d=DB(),l=SEED.slice();Object.keys(d.albums).forEach(function(k){l.unshift(d.albums[k]);});return l;}
  function find(s){var d=DB();if(d.albums[s])return d.albums[s];
    for(var i=0;i<SEED.length;i++)if(SEED[i].slug===s)return SEED[i];return null;}

  function coverEl(a,o){o=o||{};
    var nm=esc(a.name||"Meu álbum"),sb=esc([a.city,a.team].filter(Boolean).join(" · ")||"Cidade / UF · Torcida");
    var img=a.cover?'<img src="'+a.cover+'" alt="">':'<div class="gph"></div>';
    var ed=o.editable?'<div class="ed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>trocar capa</div>':'';
    var chips=o.draft?'<span>Prévia</span><span>'+a.pages.length+' pág.</span>':
      '<span>⭐ '+(a.rating||"—")+'</span><span>🔥 '+(a.votes||0)+'</span><span>'+a.pages.length+' pág.</span>';
    var c=el('<div class="sheet '+(a.orient==="h"?"h":"v")+' cover">'+img+'<div class="sc"></div>'+ed+
      '<div class="seal"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.6 6.5L21 9.3l-5 4.4 1.6 6.8L12 16.9 6.4 20.5 8 13.7 3 9.3l6.4-.8z"/></svg>MemeÁlbum</div>'+
      '<div class="mt"><div class="nm">'+nm+'</div><div class="sb">'+sb+'</div><div class="ch">'+chips+'</div></div></div>');
    if(o.editable&&o.onCover){c.style.cursor="pointer";c.addEventListener("click",o.onCover);}
    return c;}

  function pageEl(a,pi,o){o=o||{};
    var q=a.grid||9,cols=colsFor(q,a.orient),rows=Math.ceil(q/cols);
    var imgs=(a.pages&&a.pages[pi])||[],bg=(a.bgs&&a.bgs[pi])||null;
    var pn=(a.pageNames&&a.pageNames[pi])||"";
    var title=esc(a.name||"Meu álbum")+(pn?' <span style="opacity:.7">· '+esc(pn)+'</span>':'');
    var box=el('<div class="sheet '+(a.orient==="h"?"h":"v")+' pg'+(bg?" bgimg":"")+'">'+
      (bg?'<div class="bgsc"></div>':'<div class="deco"></div>')+
      '<div class="ti"><b>'+title+'</b><span class="cn">Pág. '+(pi+1)+'</span></div><div class="grid"></div></div>');
    if(bg){box.style.backgroundImage="url('"+bg+"')";box.style.backgroundSize="cover";box.style.backgroundPosition="center";}
    else box.style.background=THEMES[a.theme||0];
    var g=$(".grid",box);g.style.gridTemplateColumns="repeat("+cols+",1fr)";g.style.gridTemplateRows="repeat("+rows+",1fr)";
    for(var i=0;i<q;i++){var src=imgs[i],has=!!src;
      var inner=has?'<img src="'+src+'" alt="">':'<span class="no">'+(i+1)+(o.editable?'<span class="pl">+ foto</span>':'')+'</span>';
      var pen=(has&&o.editable)?'<span class="pen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg></span>':'';
      var cls="fig"+(has?" has":"")+(o.editable?" tap":(has?" tap zoom":""));
      var f=el('<div class="'+cls+'">'+inner+pen+'</div>');
      (function(idx,s){f.addEventListener("click",function(){
        if(o.editable)o.onTap(idx); else if(s&&o.onZoom)o.onZoom(s);});})(i,src);
      g.appendChild(f);}
    return box;}

  /* HOME */
  var rw="d";
  function home(){mp();var app=$("#app");app.innerHTML="";
    app.appendChild(el('<div><h2 class="sec">Achar um álbum</h2>'+
      '<div class="search"><input id="q" placeholder="Nome do álbum"><button id="qb">Buscar</button></div>'+
      '<button class="cta" id="cc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Criar meu álbum<span class="px" id="px"></span></button>'+
      '<div id="qr"></div><h2 class="sec">Ranking</h2>'+
      '<div class="tabs"><button data-w="d">Dia</button><button data-w="w">Semana</button><button data-w="m">Mês</button></div>'+
      '<div id="rk"></div></div>'));
    $("#px").textContent=member()?"passe ativo":"R$ "+PRICE;
    $("#cc").addEventListener("click",function(){location.hash=member()?"#/new":"#/pay";});
    app.querySelectorAll(".tabs button").forEach(function(b){if(b.dataset.w===rw)b.classList.add("on");
      b.addEventListener("click",function(){rw=b.dataset.w;home();});});
    rank();$("#qb").addEventListener("click",srch);
    $("#q").addEventListener("keydown",function(e){if(e.key==="Enter")srch();});}
  function rowEl(a,n){var img=a.cover?'<img src="'+a.cover+'">':'<div class="ph"></div>';
    var r=el('<div class="row">'+(n?'<div class="rn">'+n+'</div>':'')+'<div class="mc">'+img+
      '</div><div class="i"><div class="nm">'+esc(a.name)+'</div><div class="by">por '+esc(a.author||"alguém")+
      ' · '+esc(a.city||"")+'</div><div class="ss">★ '+(a.rating||"—")+' <span>('+(a.votes||0)+')</span></div></div></div>');
    r.addEventListener("click",function(){location.hash="#/a/"+a.slug;});return r;}
  function rank(){var b=$("#rk");b.innerHTML="";
    var l=all().filter(function(a){return (a.when||"d")===rw||a.mine;}).sort(function(x,y){return (y.rating||0)-(x.rating||0);});
    if(!l.length){b.appendChild(el('<div class="note">Sem álbuns nesse período.</div>'));return;}
    l.forEach(function(a,i){b.appendChild(rowEl(a,i+1));});}
  function srch(){var q=slug($("#q").value),b=$("#qr");b.innerHTML="";if(!$("#q").value.trim())return;
    var h=all().filter(function(a){return slug(a.name).indexOf(q)>=0;});
    if(!h.length){b.appendChild(el('<div class="note">Nenhum álbum com esse nome. Cria o seu!</div>'));return;}
    h.forEach(function(a){b.appendChild(rowEl(a));});}

  function zoom(src){var z=el('<div class="zoomwrap"><img src="'+src+'"><button class="x">Fechar</button></div>');
    function close(){z.remove();}z.addEventListener("click",function(e){if(e.target===z||e.target.className==="x")close();});
    document.body.appendChild(z);}

  /* VER ÁLBUM */
  function album(s){var a=find(s),app=$("#app");app.innerHTML="";
    if(!a){app.appendChild(el('<div class="note">Álbum não encontrado.<br><br><button class="pill" onclick="location.hash=\'#/\'">Início</button></div>'));return;}
    var nP=a.pages?a.pages.length:1,sh=0;
    app.appendChild(el('<button class="back" onclick="location.hash=\'#/\'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>Voltar</button>'));
    var nav=el('<div class="snav"><button class="nb" id="pp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></button><div class="l" id="sl"></div><button class="nb" id="pn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg></button></div>');
    app.appendChild(nav);var stg=el('<div></div>');app.appendChild(stg);
    function pt(){stg.innerHTML="";stg.appendChild(sh===0?coverEl(a,{}):pageEl(a,sh-1,{onZoom:zoom}));
      $("#sl",nav).innerHTML=(sh===0?"Capa":"Página "+sh)+"<small>"+(sh+1)+" de "+(nP+1)+"</small>";
      $("#pp",nav).disabled=sh<=0;$("#pn",nav).disabled=sh>=nP;}
    $("#pp",nav).addEventListener("click",function(){if(sh>0){sh--;pt();}});
    $("#pn",nav).addEventListener("click",function(){if(sh<nP){sh++;pt();}});pt();
    var db=DB(),mr=db.rated[s]||0;
    var rt=el('<div class="rate"><div class="av">'+(a.rating||"—")+' <small>/ 5</small></div>'+
      '<div class="lb">'+(a.votes||0)+' avaliações · toque pra avaliar</div><div class="st"></div><div class="dn"></div></div>');
    var st=$(".st",rt);for(var v=1;v<=5;v++){(function(n){var b=el('<button>★</button>');if(n<=mr)b.classList.add("lit");
      b.addEventListener("click",function(){var d=DB();d.rated[s]=n;save(d);
        st.querySelectorAll("button").forEach(function(x,ix){x.classList.toggle("lit",ix<n);});
        $(".dn",rt).textContent="Valeu! Você deu "+n+"★ (protótipo)";});st.appendChild(b);})(v);}
    app.appendChild(rt);
    var link="https://memealbum.app/a/"+s;
    var msg="🏆 Montei o álbum \""+(a.name||"")+"\" no MemeÁlbum!\n\n"+
      "👉 Abre, dá uma nota no meu e monta o teu também:\n"+link+"\n\nQuem tiver o melhor sobe no ranking 🔥";
    var sc=el('<button class="scta"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 00-8.6 15l-1.3 4.8 4.9-1.3A10 10 0 1012 2zm0 18a8 8 0 01-4.1-1.1l-.3-.2-2.9.8.8-2.8-.2-.3A8 8 0 1112 20zm4.4-6c-.2-.1-1.4-.7-1.6-.8s-.4-.1-.5.1-.6.8-.7 1-.3.2-.5.1a6.5 6.5 0 01-1.9-1.2 7.3 7.3 0 01-1.3-1.7c-.1-.2 0-.4.1-.5l.4-.4.2-.4v-.4c0-.1-.5-1.3-.7-1.8s-.4-.4-.5-.4h-.5a1 1 0 00-.7.3 3 3 0 00-.9 2.2 5.2 5.2 0 001.1 2.7 11.8 11.8 0 004.5 4c.6.3 1.1.4 1.5.5a3.6 3.6 0 001.6.1c.5-.1 1.4-.6 1.6-1.1a2 2 0 00.1-1.1c0-.1-.2-.2-.4-.3z"/></svg>Compartilhar no WhatsApp</button>');
    sc.addEventListener("click",function(){window.open("https://wa.me/?text="+encodeURIComponent(msg),"_blank");});
    app.appendChild(sc);
    var mk=el('<button class="subc">'+(member()?"Criar outro álbum":"Quero criar o meu")+'</button>');
    mk.addEventListener("click",function(){location.hash=member()?"#/new":"#/pay";});app.appendChild(mk);
    app.appendChild(el('<div class="sh">Toque numa figurinha pra dar zoom. O link no zap leva o amigo pro álbum (chumbado no protótipo).</div>'));}

  /* PAYWALL — preço único */
  function pay(){var app=$("#app");app.innerHTML="";
    app.appendChild(el('<button class="back" onclick="location.hash=\'#/\'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>Voltar</button>'));
    var ck='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M20 6L9 17l-5-5"/></svg>';
    var c=el('<div class="pay"><span class="tg">PASSE ÚNICO</span><h3>Crie quantos álbuns quiser</h3>'+
      '<div class="pr">R$ '+PRICE+' <small>uma vez só</small></div>'+
      '<p>Pague uma vez e crie à vontade. Ver e avaliar álbuns é sempre grátis.</p>'+
      '<ul><li>'+ck+'<span><b>Álbuns ilimitados</b> enquanto durar a campanha</span></li>'+
      '<li>'+ck+'<span>Capa, fundo e figurinhas personalizadas</span></li>'+
      '<li>'+ck+'<span>Link pra compartilhar no WhatsApp</span></li>'+
      '<li>'+ck+'<span>Aparece no ranking e recebe avaliações</span></li></ul>'+
      '<button class="pgo">Ativar passe e criar</button>'+
      '<button class="palt">Simular que já sou assinante</button>'+
      '<div class="pn">Pagamento SIMULADO — nada é cobrado neste protótipo.</div></div>');
    $(".pgo",c).addEventListener("click",function(){setMember(true);location.hash="#/new";});
    $(".palt",c).addEventListener("click",function(){setMember(true);location.hash="#/new";});
    app.appendChild(c);}

  /* EDITOR */
  var draft=null;
  function nd(){return {slug:"",name:"",city:"",team:"",author:"Você",rating:0,votes:0,when:"d",
    theme:0,grid:11,orient:"v",pages:[[]],bgs:[null],pageNames:[""],cover:null,mine:true};}
  function editor(){if(!member()){location.hash="#/pay";return;}if(!draft)draft=nd();
    var app=$("#app");app.innerHTML="";
    app.appendChild(el('<button class="back" onclick="if(confirm(\'Sair sem publicar?\'))location.hash=\'#/\'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>Sair sem publicar</button>'));
    var qopts="";for(var k=5;k<=12;k++)qopts+='<option value="'+k+'">'+k+' por página</option>';
    var f=el('<div class="card">'+
      '<div class="fl"><label>Nome do álbum</label><input id="e-nm" placeholder="Ex.: Copa da Resenha"></div>'+
      '<div class="fl"><label>Cidade / UF</label><input id="e-ct" placeholder="Ex.: Londrina / PR"></div>'+
      '<div class="fl"><label>Torcida / time</label><input id="e-tm" placeholder="Ex.: Tubarões FC"></div>'+
      '<div class="fl"><label>Figurinhas por página</label><select id="e-gr">'+qopts+'</select></div>'+
      '<div class="fl"><label>Orientação</label><div class="seg"><button data-o="v" id="ov">Vertical</button><button data-o="h" id="oh">Horizontal</button></div></div>'+
      '<div class="fl"><label>Cor do tema da página</label><div class="swatches" id="sw"></div></div></div>');
    app.appendChild(f);
    $("#e-nm",f).value=draft.name;$("#e-ct",f).value=draft.city;$("#e-tm",f).value=draft.team;$("#e-gr",f).value=draft.grid;
    $("#e-nm",f).addEventListener("input",function(e){draft.name=e.target.value;rp();});
    $("#e-ct",f).addEventListener("input",function(e){draft.city=e.target.value;rp();});
    $("#e-tm",f).addEventListener("input",function(e){draft.team=e.target.value;rp();});
    $("#e-gr",f).addEventListener("change",function(e){draft.grid=+e.target.value;rp();});
    function setO(){$("#ov",f).classList.toggle("on",draft.orient==="v");$("#oh",f).classList.toggle("on",draft.orient==="h");}
    $("#ov",f).addEventListener("click",function(){draft.orient="v";setO();rp();});
    $("#oh",f).addEventListener("click",function(){draft.orient="h";setO();rp();});setO();
    var sw=$("#sw",f);THEMES.forEach(function(g,ix){var d=el('<div class="sw"></div>');
      d.style.background=g;if(ix===draft.theme)d.classList.add("on");
      d.addEventListener("click",function(){draft.theme=ix;
        sw.querySelectorAll(".sw").forEach(function(x,j){x.classList.toggle("on",j===ix);});rp();});
      sw.appendChild(d);});
    app.appendChild(el('<h2 class="sec">Prévia — toque pra editar</h2>'));
    var nav=el('<div class="snav"><button class="nb" id="ep"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></button><div class="l" id="el"></div><button class="nb" id="en"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg></button></div>');
    app.appendChild(nav);var stg=el('<div></div>');app.appendChild(stg);
    var pname=el('<div class="fl" id="pnf" style="margin-top:11px"><label>Nome desta página (opcional)</label><input id="e-pn" placeholder="Ex.: Titulares, Reservas, A galera"></div>');
    app.appendChild(pname);
    var bgr=el('<div class="bgrow" id="bgr"></div>');app.appendChild(bgr);
    app.appendChild(el('<div class="tip">Folheie Capa → Página 1 → Página 2. Toque na capa ou numa figurinha pra trocar.</div>'));
    var acts=el('<div class="acts"><button class="ap" id="addpg">+ Página</button><button class="pb" id="pub">Publicar álbum</button></div>');
    app.appendChild(acts);
    var sh=0;
    function rp(){
      if(!draft.bgs)draft.bgs=[];if(!draft.pageNames)draft.pageNames=[];
      while(draft.bgs.length<draft.pages.length)draft.bgs.push(null);
      while(draft.pageNames.length<draft.pages.length)draft.pageNames.push("");
      var nP=draft.pages.length;if(sh>nP)sh=nP;stg.innerHTML="";
      if(sh===0){pname.style.display="none";bgr.style.display="none";
        stg.appendChild(coverEl(draft,{editable:true,draft:true,onCover:function(){pick(function(d){draft.cover=d;rp();});}}));
      }else{var pi=sh-1;
        stg.appendChild(pageEl(draft,pi,{editable:true,onTap:function(idx){
          pick(function(d){if(!draft.pages[pi])draft.pages[pi]=[];draft.pages[pi][idx]=d;rp();});}}));
        pname.style.display="block";var inp=$("#e-pn",pname);inp.value=draft.pageNames[pi]||"";
        inp.oninput=function(){draft.pageNames[pi]=inp.value;var t=$(".ti b",stg);
          if(t)t.innerHTML=esc(draft.name||"Meu álbum")+(inp.value?' <span style="opacity:.7">· '+esc(inp.value)+'</span>':'');};
        bgr.style.display="flex";bgr.innerHTML="";var hb=!!draft.bgs[pi];
        var bs=el('<button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>'+(hb?"Trocar fundo":"Colocar fundo")+'</button>');
        bs.addEventListener("click",function(){pick(function(d){draft.bgs[pi]=d;rp();});});bgr.appendChild(bs);
        if(hb){var br=el('<button class="rm">Remover fundo</button>');
          br.addEventListener("click",function(){draft.bgs[pi]=null;rp();});bgr.appendChild(br);}}
      $("#el",nav).innerHTML=(sh===0?"Capa":"Página "+sh)+"<small>"+(sh+1)+" de "+(nP+1)+"</small>";
      $("#ep",nav).disabled=sh<=0;$("#en",nav).disabled=sh>=nP;}
    $("#ep",nav).addEventListener("click",function(){if(sh>0){sh--;rp();}});
    $("#en",nav).addEventListener("click",function(){if(sh<draft.pages.length){sh++;rp();}});
    $("#addpg",acts).addEventListener("click",function(){draft.pages.push([]);draft.bgs.push(null);
      draft.pageNames.push("");sh=draft.pages.length;rp();});
    $("#pub",acts).addEventListener("click",function(){if(!draft.name.trim()){alert("Dá um nome pro álbum.");return;}
      var d=DB();draft.slug=slug(draft.name);draft.rating=+("4."+(5+Math.floor(Math.random()*4)));draft.votes=1;
      d.albums[draft.slug]=JSON.parse(JSON.stringify(draft));if(!save(d))return;
      var s=draft.slug;draft=null;location.hash="#/a/"+s;});
    rp();}

  function route(){var h=location.hash.replace(/^#\/?/,"");
    if(h.indexOf("a/")===0)return album(h.slice(2));
    if(h==="pay")return pay();if(h==="new")return editor();return home();}
  window.addEventListener("hashchange",route);mp();route();
})();
</script>
</body>
</html>
