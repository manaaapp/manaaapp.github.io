<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&display=swap" rel="stylesheet">
<style>
 *{margin:0;padding:0;box-sizing:border-box;}
 body{background:#11141a;font-family:'Inter',sans-serif;color:#e8eaf0;padding:24px;}
 h1{font-size:26px;font-weight:700;text-align:center;margin-bottom:4px;}
 .sub{text-align:center;color:#8b93a7;font-size:15px;margin-bottom:24px;}

 .cell{background:#1b1f29;border-radius:12px;overflow:hidden;position:relative;}
 .cell img{width:100%;height:420px;object-fit:cover;display:block;}
 .num{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.7);color:#fff;font-weight:700;font-size:18px;padding:4px 12px;border-radius:20px;}
</style></head><body>
