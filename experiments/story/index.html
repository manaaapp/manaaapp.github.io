<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Postar no story — Manaã</title>
<style>
  :root{
    --bg:#1a1410; --card:#241c16; --gold:#d9b26a; --gold2:#c79a4e;
    --ink:#f3ece0; --muted:#a89b86;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  body{min-height:100dvh;display:flex;flex-direction:column;align-items:center;
    padding:24px 18px calc(24px + env(safe-area-inset-bottom));gap:18px}
  .top{text-align:center;margin-top:8px}
  .brand{font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:600}
  h1{font-size:21px;margin:6px 0 2px;font-weight:700}
  .sub{font-size:14px;color:var(--muted);margin:0;line-height:1.45}
  .preview{width:min(72vw,260px);aspect-ratio:9/16;border-radius:18px;overflow:hidden;
    background:#000;box-shadow:0 14px 40px rgba(0,0,0,.55);border:1px solid rgba(217,178,106,.18)}
  .preview canvas{width:100%;height:100%;display:block}
  .actions{width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px;margin-top:2px}
  button,a.btn{font:inherit;font-size:17px;font-weight:700;border:0;border-radius:16px;
    padding:17px;text-align:center;text-decoration:none;cursor:pointer;display:block}
  .primary{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#2a1f12;
    box-shadow:0 8px 22px rgba(217,178,106,.32)}
  .primary:active{transform:translateY(1px)}
  .ghost{background:transparent;color:var(--ink);border:1px solid rgba(243,236,224,.22)}
  .hint{font-size:13px;color:var(--muted);text-align:center;line-height:1.5;max-width:340px;margin:2px auto 0}
  .hint b{color:var(--gold)}
  .foot{margin-top:auto;padding-top:16px;font-size:12px;color:#6f6453;text-align:center}
  .spin{display:none}
  .busy .spin{display:inline-block}
  .busy .lbl{opacity:.6}
</style>
</head>
<body>
  <div class="top">
    <div class="brand">Manaã</div>
    <h1>Seu devocional de hoje</h1>
    <p class="sub">Pronto no formato de story. Toque abaixo pra<br>salvar e abrir o Instagram.</p>
  </div>

  <div class="preview"><canvas id="cv" width="1080" height="1920"></canvas></div>

  <div class="actions">
    <button class="primary" id="share"><span class="lbl">📲 Salvar e postar no story</span><span class="spin"> …</span></button>
    <a class="btn ghost" id="dl" download="devocional-manaa.jpg">⬇️ Só baixar a imagem</a>
  </div>

  <p class="hint" id="hint">Vai abrir o menu de compartilhar — escolha <b>Instagram → Stories</b>. A imagem já vai carregada, é só publicar. 🙏</p>

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = 1080, H = 1920;
let storyBlob = null, storyURL = null;

function roundRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}

function buildStory(img){
  // fundo: arte ampliada, desfocada e escurecida pra preencher 9:16
  const iw=img.width, ih=img.height;
  const scale=Math.max(W/iw, H/ih)*1.15;
  const bw=iw*scale, bh=ih*scale;
  ctx.save();
  ctx.filter='blur(34px) brightness(.55)';
  ctx.drawImage(img,(W-bw)/2,(H-bh)/2,bw,bh);
  ctx.restore();
  // leve vinheta quente por cima
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'rgba(20,14,9,.35)');g.addColorStop(.5,'rgba(20,14,9,.05)');g.addColorStop(1,'rgba(20,14,9,.5)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // arte 4:5 centralizada com cantos e sombra
  const cardW=940, cardH=cardW*(ih/iw), cx=(W-cardW)/2, cy=(H-cardH)/2;
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,.45)';ctx.shadowBlur=48;ctx.shadowOffsetY=18;
  roundRect(ctx,cx,cy,cardW,cardH,40);ctx.fillStyle='#000';ctx.fill();
  ctx.restore();
  ctx.save();roundRect(ctx,cx,cy,cardW,cardH,40);ctx.clip();
  ctx.drawImage(img,cx,cy,cardW,cardH);ctx.restore();
}

function exportStory(){
  return new Promise(res=>{
    cv.toBlob(b=>{ storyBlob=b; if(storyURL)URL.revokeObjectURL(storyURL);
      storyURL=URL.createObjectURL(b); document.getElementById('dl').href=storyURL; res(b);
    },'image/jpeg',0.92);
  });
}

const img=new Image();
img.onload=async()=>{ buildStory(img); await exportStory(); };
img.src=DATA_URI;

document.getElementById('share').addEventListener('click',async()=>{
  const btn=document.getElementById('share'); btn.classList.add('busy');
  try{
    if(!storyBlob) await exportStory();
    const file=new File([storyBlob],'devocional-manaa.jpg',{type:'image/jpeg'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:'Devocional Manaã'});
    }else{
      // fallback: baixa e instrui
      const a=document.getElementById('dl'); a.click();
      document.getElementById('hint').innerHTML='Imagem baixada! 📥 Abra o <b>Instagram → Story</b>, toque na galeria e escolha o devocional.';
    }
  }catch(e){ /* usuário cancelou — ok */ }
  btn.classList.remove('busy');
});
</script>
