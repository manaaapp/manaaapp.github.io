<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Postar no story — Manaã</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:#1a1410;color:#f3ece0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    text-align:center;padding:22px 16px 40px}
  .brand{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:#d9b26a;font-weight:600}
  h1{font-size:20px;margin:6px 0 4px}
  .sub{font-size:14px;color:#a89b86;margin-bottom:16px}
  img.art{width:min(62vw,220px);border-radius:16px;border:1px solid rgba(217,178,106,.2);
    box-shadow:0 12px 32px rgba(0,0,0,.5);display:block;margin:0 auto 18px}
  .btn{display:block;width:100%;max-width:400px;margin:10px auto;font-size:17px;font-weight:700;
    border:0;border-radius:15px;padding:16px;text-decoration:none}
  .primary{background:linear-gradient(135deg,#d9b26a,#c79a4e);color:#2a1f12}
  .ghost{background:transparent;color:#f3ece0;border:1px solid rgba(243,236,224,.22)}
  .hint{font-size:13px;color:#a89b86;margin-top:12px;line-height:1.5;max-width:340px;margin-left:auto;margin-right:auto}
  .hint b{color:#d9b26a}
</style>
</head>
<body>
  <div class="brand">Manaã</div>
  <h1>Seu devocional de hoje</h1>
  <div class="sub">Pronto pro story.</div>
  <img class="art" src="img/story-9x16.jpg?v=3" alt="Devocional">
  <button class="primary btn" id="share">📲 Salvar e postar no story</button>
  <a class="ghost btn" id="dl" href="img/story-9x16.jpg?v=3" download="devocional-manaa.jpg">⬇️ Só baixar a imagem</a>
  <p class="hint" id="hint">Toque acima → escolha <b>Instagram → Stories</b>. 🙏</p>
<script>
  document.getElementById('share').addEventListener('click', async function(){
    var hint=document.getElementById('hint');
    try{
      var r=await fetch('img/story-9x16.jpg?v=3');
      var b=await r.blob();
      var f=new File([b],'devocional-manaa.jpg',{type:'image/jpeg'});
      if(navigator.canShare && navigator.canShare({files:[f]})){
        await navigator.share({files:[f]});
      }else if(navigator.share){
        await navigator.share({title:'Devocional Manaã',url:location.href});
      }else{
        document.getElementById('dl').click();
        hint.innerHTML='Imagem baixada! Abra o <b>Instagram → Story</b> e escolha ela na galeria.';
      }
    }catch(e){
      hint.innerHTML='Se não abriu, toque em <b>Só baixar a imagem</b> e poste pela galeria do Instagram.';
    }
  });
</script>
</body>
</html>
