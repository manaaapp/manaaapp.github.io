<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manaã — começar</title>
<meta name="robots" content="noindex">
<meta property="og:title" content="Manaã">
<meta property="og:description" content="Seu companheiro de fé no WhatsApp.">
<script>
  // O link limpo (manaaapp.com/comecar) manda a mensagem SEM marca nenhuma — é o que vai no
  // devocional e o que a pessoa lê. Marca no texto do usuário é lixo visual.
  // A marca só entra quando alguém monta um convite com ?o=..., que é o caso dos
  // multiplicadores. Aí o webhook lê a primeira mensagem, extrai o que está entre colchetes e
  // grava em assinantes.origem, e dá para separar quem veio de qual convite.
  var o = (new URLSearchParams(location.search).get("o") || "")
    .replace(/[^a-zA-Z0-9_-]/g, "").slice(0, 30);
  var texto = "Oi! Quero começar meu devocional no Manaã 🙏" + (o ? " [" + o + "]" : "");
  var destino = "https://wa.me/5543988709624?text=" + encodeURIComponent(texto);
  location.replace(destino);
</script>
<noscript>
  <meta http-equiv="refresh" content="0;url=https://wa.me/5543988709624?text=Oi!%20Quero%20come%C3%A7ar%20meu%20devocional%20no%20Mana%C3%A3%20%F0%9F%99%8F">
</noscript>
<style>
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f7f4ef;color:#3a3a3a;
       display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0;text-align:center}
  a{color:#7a5c3e;font-weight:600}
</style>
</head>
<body>
  <div>
    <p>Abrindo o WhatsApp do Manaã…</p>
    <p>Se não abrir automaticamente, <a id="link" href="https://wa.me/5543988709624?text=Oi!%20Quero%20come%C3%A7ar%20meu%20devocional%20no%20Mana%C3%A3%20%F0%9F%99%8F">toque aqui</a>.</p>
  </div>
  <script>
    // O link de escape carrega a mesma marca (ou a ausência dela) do redirect automático.
    var a = document.getElementById("link");
    if (a) { a.href = destino; }
  </script>
</body>
</html>
