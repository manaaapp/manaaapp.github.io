document.getElementById('pixPayloadCopy').addEventListener('click', async () => {
  const v = document.getElementById('pixPayloadCopy').dataset.payload;
  try { await navigator.clipboard.writeText(v); } catch(e){}
  document.getElementById('pixCopiedTxt').style.display = 'block';
});
