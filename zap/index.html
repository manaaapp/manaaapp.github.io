<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manaã — começar</title>
<meta name="robots" content="noindex">
<meta property="og:title" content="Manaã">
<meta property="og:description" content="Seu companheiro de fé no WhatsApp.">
<script>
  // Uma unica porta de entrada (02/09/2026): cadastro primeiro, WhatsApp depois.
  // Antes este link abria o wa.me direto; a pessoa chegava "desconhecida" e o Manaa mandava
  // ela de volta ao site. Agora: /comecar -> formulario -> tela "Tudo pronto" -> botao do WhatsApp.
  // A origem (?o=ig|zap|grupo|...) viaja para o cadastro e fica em assinantes.origem.
  var o = (new URLSearchParams(location.search).get("o") || "zap").replace(/[^a-zA-Z0-9_-]/g, "").slice(0, 30);
  location.replace("/onboarding.html?plano=trial" + (o ? "&o=" + encodeURIComponent(o) : ""));
</script>
<noscript><meta http-equiv="refresh" content="0;url=/onboarding.html?plano=trial&o=zap"></noscript>
<style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f7f4ef;color:#3a3a3a;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0;text-align:center} a{color:#7a5c3e;font-weight:600}</style>
</head>
<body><div><p>Abrindo o cadastro do Manaã…</p><p>Se não abrir sozinho, <a href="/onboarding.html?plano=trial&o=zap">toque aqui</a>.</p></div></body>
</html>
