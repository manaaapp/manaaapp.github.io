<style>
  :root { --bg:#FBF7F0; --ink:#2B2520; --muted:#5C564D; --gold:#8B6914; --line:#E5DDD0; --wa:#0F7A4F; }
  * { box-sizing:border-box; }
  html, body { background:var(--bg); }
  body { margin:0; color:var(--ink); font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; font-size:17px; line-height:1.55; -webkit-text-size-adjust:100%; }
  main { max-width:520px; margin:0 auto; padding:40px 16px 56px; text-align:center; }
  .marca { display:inline-flex; align-items:center; gap:10px; text-decoration:none; color:var(--gold); min-height:44px; margin-bottom:24px; }
  .marca img { width:44px; height:44px; border-radius:50%; }
  .marca span { font-family:'Playfair Display',Georgia,serif; font-size:30px; font-weight:700; letter-spacing:.2px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:28px 20px; box-shadow:0 6px 28px rgba(139,105,20,.08); }
  .num { font-family:'Playfair Display',Georgia,serif; font-size:44px; font-weight:700; color:var(--gold); line-height:1; margin:0 0 10px; }
  h1 { font-size:24px; line-height:1.25; margin:0 0 12px; color:var(--ink); }
  p { margin:0 0 18px; color:var(--muted); }
  .acoes { display:flex; flex-direction:column; gap:12px; margin-top:6px; }
  .btn { display:flex; align-items:center; justify-content:center; gap:10px; min-height:52px; padding:14px 20px; border-radius:12px; font-size:17px; font-weight:600; text-decoration:none; }
  .btn-ouro { background:var(--gold); color:#fff; }
  .btn-wa { background:var(--wa); color:#fff; }
  .btn-sec { background:#fff; color:var(--ink); border:1.5px solid var(--line); }
  .btn:focus-visible { outline:3px solid #B8912E; outline-offset:2px; }
  .mini { font-size:15px; color:var(--muted); margin-top:20px; }
  .mini a { color:var(--gold); font-weight:600; display:inline-block; padding:12px 4px; }
  @media (min-width:600px) { main { padding-top:64px; } .card { padding:36px 32px; } }
</style>

<body>
<main>
  <a class="marca" href="/" aria-label="Manaã — página inicial">
    <img src="/assets/manaa-logo-round.png?v=2" alt="" width="44" height="44">
    <span>Manaã</span>
  </a>
  <div class="card">
    <div class="num" aria-hidden="true">404</div>
    <h1>Não encontramos esta página</h1>
    <p>O endereço pode ter sido digitado com algum erro ou o link já não vale mais. Está tudo bem: escolha abaixo para onde quer ir.</p>
    <div class="acoes">
      <a class="btn btn-ouro" href="/">Ir para a página inicial</a>
      <a class="btn btn-wa" href="https://manaaapp.com/oi/">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M12 0C5.373 0 0 5.373 0 12c0 2.116.554 4.103 1.523 5.823L.046 23.5l5.82-1.525A11.95 11.95 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.818a9.818 9.818 0 01-5.012-1.375l-.36-.213-3.729.977.994-3.62-.234-.373A9.818 9.818 0 012.182 12c0-5.42 4.398-9.818 9.818-9.818 5.42 0 9.818 4.398 9.818 9.818 0 5.42-4.398 9.818-9.818 9.818z"/></svg>
        Falar com o Manaã no WhatsApp

      <a class="btn btn-sec" href="/conta.html">Minha conta</a>
    </div>
  </div>
  <p class="mini">Dúvidas? Veja as <a href="/faq.html">perguntas frequentes</a>.</p>
</main>
