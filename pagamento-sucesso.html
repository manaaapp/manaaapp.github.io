<style>

    margin: 0 auto 20px;
    display: flex; align-items: center; justify-content: center;
    color: white; font-size: 50px; font-weight: 700;
    box-shadow: 0 8px 24px rgba(34,197,94,0.28);

  h1 {

    display: flex; justify-content: center; width: 100%; min-height: 52px; align-items: center; gap: 10px;
    box-shadow: 0 6px 18px rgba(184,145,46,0.3);
    transition: transform 0.15s;
  }
  .btn:hover { transform: translateY(-2px); }
  .hint {
    margin-top: 20px;
    color: #8C847A; font-size: 13px; line-height: 1.5;
  }
  /* O logo estava sozinho no topo e o nome so aparecia no rodape — em todas as outras
     telas eles vem juntos. Aqui e a tela que confirma pagamento: e onde a marca mais
     precisa estar inteira. */
  .marca-topo { display:flex; align-items:center; justify-content:center; gap:10px; margin:0 auto 18px; }
  .marca-nome { font-family: 'Playfair Display', Georgia, serif; color:#8B6914; font-size:28px; font-weight:700; letter-spacing:.3px; line-height:1; }

<body>
  <div class="card">
    <div class="marca-topo">
      <img src="/assets/manaa-logo-round.png?v=2" alt="" style="width:48px;height:48px;border-radius:50%;display:block">
      <span class="marca-nome">Manaã</span>
    </div>
    <div class="check-wrap">✓</div>
    <h1 id="title">Pagamento confirmado</h1>
    <p class="sub" id="sub">Pronto, sua assinatura do Manaã está ativa. Agora é só abrir o WhatsApp e enviar a primeira mensagem pra começar a conversa.</p>
    <a id="wa-btn" href="https://wa.me/5543984323619?text=Paguei%20a%20assinatura%20Mana%C3%A3%20quero%20ativar%20%F0%9F%99%8F" class="btn">
      <span style="white-space:nowrap">Abrir WhatsApp</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="flex:0 0 auto"><path d="M12.042 1.978c-5.54 0-10.04 4.5-10.04 10.04 0 1.769.464 3.494 1.346 5.014l-1.432 5.23 5.35-1.402c1.466.799 3.117 1.222 4.776 1.222 5.54 0 10.04-4.5 10.04-10.04 0-2.687-1.046-5.213-2.946-7.112-1.9-1.9-4.425-2.952-7.094-2.952zm0 1.84c2.178 0 4.225.848 5.768 2.39 1.543 1.544 2.392 3.591 2.392 5.77 0 4.523-3.68 8.199-8.199 8.199-1.423 0-2.82-.376-4.042-1.085l-.29-.17-2.997.786.802-2.933-.186-.3a8.126 8.126 0 0 1-1.247-4.335c0-4.523 3.68-8.199 8.199-8.199zm-3.91 4.475c-.17 0-.445.064-.676.32-.232.256-.882.862-.882 2.102 0 1.24.903 2.438 1.028 2.605.125.169 1.752 2.695 4.303 3.781.605.257 1.078.411 1.446.528.608.193 1.161.165 1.598.1.488-.073 1.501-.614 1.714-1.206.213-.592.213-1.1.149-1.206-.064-.105-.232-.169-.488-.297-.256-.128-1.501-.741-1.734-.826-.232-.085-.402-.128-.572.128-.17.256-.659.826-.808.995-.148.17-.297.19-.552.064-.256-.128-1.08-.399-2.058-1.27-.761-.677-1.274-1.513-1.423-1.769-.148-.256-.016-.394.112-.522.115-.114.256-.297.384-.445.128-.149.17-.257.256-.427.085-.17.043-.318-.021-.446-.064-.128-.573-1.376-.783-1.888-.207-.498-.418-.43-.572-.438-.148-.007-.318-.009-.488-.009z"/></svg>

<script>
  /* Esta tela nao libera nada — quem libera acesso e o aviso do Asaas. Mas ela AFIRMA que o
     pagamento foi confirmado, e isso e uma afirmacao forte. Quem gerou um PIX, nao pagou e
     voltou pelo historico do navegador cairia aqui e acharia que estava tudo certo — depois
     nao pagaria e sumiria sem entender.
     Quando vier o identificador do pagamento na URL, conferimos de verdade antes de afirmar. */
  /* A venda so e contada quando o gateway confirma. Abrir esta pagina nao prova nada: quem gerou
     um PIX, nao pagou e voltou pelo historico cai aqui igual. E recarregar a pagina nao pode
     contar a mesma venda duas vezes — dai a marca em localStorage por identificador. */
  var PLANOS = { mensal: 14.99, anual: 159.99 };
  function contarVenda(id, plano) {
    try {
      if (!id || !PLANOS[plano]) return;                 // sem cobranca ou plano nao pagavel
      var marca = 'manaa_venda_' + id;
      if (localStorage.getItem(marca)) return;           // ja contada neste navegador
      localStorage.setItem(marca, '1');
      gtag('event', 'purchase', {
        transaction_id: id, value: PLANOS[plano], currency: 'BRL',
        items: [{ item_name: 'Manaa ' + plano, price: PLANOS[plano], quantity: 1 }]
      });
    } catch (e) { /* navegador sem localStorage nao pode derrubar a tela */ }
  }

  async function confereStatus(id) {
    if (!id) return null;
    try {
      const ctl = new AbortController();
      setTimeout(() => ctl.abort(), 9000);
      const r = await fetch('https://manaa-meta-webhook.manaa-fbx.workers.dev/webhook/manaa-asaas-status?id='
                            + encodeURIComponent(id), { signal: ctl.signal });
      const d = await r.json();
      return { status: String((d && d.status) || '').toLowerCase(),
               plano:  String((d && d.plano)  || '').toLowerCase() };
    } catch (e) { return null; }   // rede ruim nao vira acusacao de nao ter pago
  }

  (function () {
    var p = new URLSearchParams(location.search);
    var plan = (p.get('plan') || '').toLowerCase();
    var msg = "Oi%20Mana%C3%A3%20%F0%9F%99%8F%20vamos%20come%C3%A7ar%3F";
    if (plan === 'anual') msg = "Oi%20Mana%C3%A3%20%F0%9F%99%8F%20vamos%20come%C3%A7ar%3F";
    if (plan === 'mensal') msg = "Oi%20Mana%C3%A3%20%F0%9F%99%8F%20vamos%20come%C3%A7ar%3F";
    if (plan === 'trial' || plan === 'free_trial') {
      msg = "Oi%20Mana%C3%A3%20%F0%9F%99%8F%20vamos%20come%C3%A7ar%3F";
      var t = document.getElementById('title'); if (t) t.textContent = 'Tudo pronto';
      var s = document.getElementById('sub'); if (s) s.textContent = 'Seu teste de 7 dias começou. Amanhã no horário que você escolheu chega o primeiro devocional no WhatsApp. Se quiser, pode falar comigo agora.';
    }
    var status = (p.get('status') || '').toLowerCase();
    if (status === 'existing') {
      msg = "Oi%20Mana%C3%A3%20%F0%9F%99%8F";
      var t2 = document.getElementById('title'); if (t2) t2.textContent = 'Você já está com a gente';
      var s2 = document.getElementById('sub'); if (s2) s2.textContent = 'Sua assinatura do Manaã já está ativa. Continue conversando comigo pelo WhatsApp — é só seguir falando.';
      var btnLabel = document.querySelector('#wa-btn span'); if (btnLabel) btnLabel.textContent = 'Continuar no WhatsApp';
    }
    // se veio identificador, confirma com o gateway antes de manter o "confirmado"
    var idPg = p.get('id');
    if (idPg && plan !== 'trial' && plan !== 'free_trial') {
      confereStatus(idPg).then(function (resp) {
        if (!resp || !resp.status) return;                 // nao conseguiu conferir: nao muda nada
        var pago = ['confirmed','received','received_in_cash','paid','active'].indexOf(resp.status) >= 0;
        // o plano vem do gateway, nao da barra de endereco: trocar plan=mensal por plan=anual
        // na URL inflaria a receita relatada sem ninguem perceber
        if (pago) { contarVenda(idPg, resp.plano || plan); return; }
        var t = document.getElementById('title');
        var sb = document.getElementById('sub');
        var ck = document.querySelector('.check-wrap');
        if (t) t.textContent = 'Pagamento ainda nao confirmado';
        if (sb) sb.textContent = 'Se voce pagou agora, pode levar alguns minutos pra cair. Assim que confirmar, seu devocional comeca a chegar. Qualquer duvida, fale comigo no WhatsApp.';
        if (ck) { ck.textContent = '!'; ck.style.background = 'linear-gradient(135deg,#E0A32E,#C98A1E)'; }
      });
    }

    var url = "https://wa.me/5543984323619?text=" + msg;
    var waBtn = document.getElementById('wa-btn');
    waBtn.href = url;
    waBtn.setAttribute('target', '_blank');
    waBtn.setAttribute('rel', 'noopener noreferrer');
    // Dispara clique programático em 3s — abre em nova aba
    setTimeout(function(){
      var a = document.createElement('a');
      a.href = url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }, 3000);
  })();
</script>
